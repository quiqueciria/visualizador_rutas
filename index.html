<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor de rutas GPX</title>

    <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <link type="text/css" rel="stylesheet" href="https://componentes-beta.idee.es/api-idee/assets/css/apiidee.ol.min.css">

  <link type="text/css" rel="stylesheet" href="assets/css/styles.css">

  <script type="text/javascript" src="https://componentes-beta.idee.es/api-idee/vendor/browser-polyfill.js"></script>
  <script type="text/javascript" src="https://componentes-beta.idee.es/api-idee/js/apiidee.ol.min.js"></script>
  <script type="text/javascript" src="https://componentes-beta.idee.es/api-idee/js/configuration.js"></script>

     <!-- backimglayer plugin -->
    <link href="https://componentes-beta.idee.es/api-idee/plugins/backimglayer/backimglayer.ol.min.css"
        rel="stylesheet" />
    <script type="text/javascript"
        src="https://componentes-beta.idee.es/api-idee/plugins/backimglayer/backimglayer.ol.min.js"></script>



</head>
<body>
  <!-- Botón para abrir/cerrar el panel en móvil -->
  <button id="sidebarToggle">☰</button>

  <!-- Aplicación principal -->
  <div id="app">
    <!-- Panel lateral izq -->
    <aside id="sidebar">
      <div class="panel-title">
        <h3>Rutas GPX</h3>
      </div>

      <!-- Controles principales de vista y mapa -->
      <div class="flex items-stretch gap-2 mb-3">
        <button id="fitAllBtn" type="button" title="Ajustar vista a todas las rutas">Ajustar vista</button>

        <button id="mapFilter" class="map-filter flex-1 flex items-center justify-between px-2.5 py-2 text-xs font-semibold text-slate-700 bg-white hover:bg-slate-50 border border-slate-200 rounded-lg shadow-sm transition-all cursor-pointer" type="button" aria-pressed="false" title="Alternar entre mapa en color y blanco y negro">
          <span class="flex items-center gap-1.5 min-w-0">
            <svg class="w-3.5 h-3.5 text-slate-500 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"/>
              <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>
            </svg>
            <span id="mapFilterText" class="truncate">Color</span>
          </span>
          <span id="mapFilterToggle" class="shrink-0">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="1" y="5" width="22" height="14" rx="7" ry="7" class="text-slate-300 fill-slate-100" />
              <circle cx="8" cy="12" r="3" class="fill-white stroke-slate-400" />
            </svg>
          </span>
        </button>
      </div>

      <!-- Selector para ordenar rutas -->
      <div class="flex items-center gap-2 mb-3">
        <label for="sortRoutes" class="text-xs font-semibold text-slate-500 shrink-0">Ordenar:</label>
        <select id="sortRoutes" class="w-full text-xs font-semibold text-slate-700 bg-white border border-slate-200 rounded-lg px-2 py-1.5 shadow-sm hover:bg-slate-50 focus:outline-none focus:ring-1 focus:ring-sky-500 cursor-pointer">
          <option value="default">📋 Por defecto</option>
          <option value="dist-desc">📏 Distancia (↓ mayor a menor)</option>
          <option value="dist-asc">📏 Distancia (↑ menor a mayor)</option>
          <option value="ele-desc">⛰️ Desnivel (↓ mayor a menor)</option>
          <option value="ele-asc">⛰️ Desnivel (↑ menor a mayor)</option>
        </select>
      </div>

      <!-- Lista dinámica de rutas cargadas -->
      <div id="routeList"></div>
    </aside>

    <!-- Mapa de la derecha -->
    <div id="mapjs" class="m-container"></div>
  </div>

  <script type="text/javascript">
        window.mapjs = IDEE.map({
            container: 'mapjs',
            controls: ['attributions', 'location*true*false',],
          center: [-412305.13, 4926696.67],
          zoom: 7,
        });

        // BackImgLayer PLUGIN (descomentar para usar)
                  const backImgLayer = new IDEE.plugin.BackImgLayer({
                  order: 0,
                    layerOpts: [
                    {
                        id: 'MapaRaster',
                        title: 'Cartografía Ráster de España del IGN',
                        preview: 'https://www.ign.es/iberpix/img/raster.png',
                        layers: [new IDEE.layer.WMTS({
                                url: 'https://www.ign.es/wmts/mapa-raster?',
                                name: 'MTN',
                                legend: 'Cartografía Ráster de España del IGN',
                                matrixSet: 'GoogleMapsCompatible',
                                isBase: true,
                                displayInLayerSwitcher: false,
                                queryable: false,
                                visible: true,
                                format: 'image/jpeg',
                        })],
                    },
                    {
                        id: 'mapa',
                        title: 'Callejero de España del IGN',
                        preview: 'https://www.ign.es/iberpix/img/mapa.png', // ruta relativa, edite por la deseada
                        layers: [new IDEE.layer.WMTS({
                                url: 'https://www.ign.es/wmts/ign-base?',
                                name: 'IGNBaseTodo',
                                legend: 'Callejero',
                                matrixSet: 'GoogleMapsCompatible',
                                isBase: true,
                                displayInLayerSwitcher: false,
                                queryable: false,
                                visible: true,
                                format: 'image/jpeg',
                        })],
                    },
                    {
                      id: 'openstreetmap',
                      title: 'OpenStreetMap',
                      preview: 'https://tile.openstreetmap.org/6/31/24.png',
                      layers: [new IDEE.layer.XYZ({
                                url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
                                name: 'OpenStreetMap',
                                legend: 'OpenStreetMap',
                                projection: 'EPSG:3857',
                                attributions: '© OpenStreetMap contributors',
                                isBase: true,
                                displayInLayerSwitcher: false,
                                queryable: false,
                                visible: true,
                                maxZoom: 19,
                      })],
                    },
                    {
                        id: 'Imagen',
                        title: 'Imagen',
                        preview: 'https://www.ign.es/iberpix/img/image.png', // URL de previsualización oficial [cite: 67]
                        layers: [
                            new IDEE.layer.XYZ({
                                url: 'https://tms-pnoa-ma.idee.es/1.0.0/pnoa-ma/{z}/{x}/{-y}.jpeg',
                                name: 'PNOA',
                                legend: 'Ortofoto',
                                projection: 'EPSG:3857',
                                isBase: true,
                                displayInLayerSwitcher: false,
                                queryable: false,
                                visible: true,
                                maxZoom: 19
                            }),
                            new IDEE.layer.WMTS({
                                url: 'https://www.ign.es/wmts/pnoa-ma?',
                                name: 'OI.OrthoimageCoverage',
                                matrixSet: 'GoogleMapsCompatible',
                                legend: 'Ortofoto',
                                isBase: false,
                                displayInLayerSwitcher: false,
                                queryable: false,
                                visible: true,
                                format: 'image/jpeg',
                                minZoom: 19
                            })
                        ]
                    }, 
                    {
                            id: 'hibrido',
                            title: 'Híbrido',
                            preview: 'https://www.ign.es/iberpix/img/hibrido.png', // ruta relativa, edite por la deseada
                            layers: [
                                new IDEE.layer.XYZ({
                                url: 'https://tms-pnoa-ma.idee.es/1.0.0/pnoa-ma/{z}/{x}/{-y}.jpeg',
                                name: 'PNOA-MA',
                                legend: 'Imagen (PNOA)',
                                projection: 'EPSG:3857',
                                isBase: true,
                                displayInLayerSwitcher: false,
                                queryable: false,
                                visible: true,
                                tileGridMaxZoom: 19,
                          }),
                                new IDEE.layer.WMTS({
                                url: 'https://www.ign.es/wmts/ign-base?',
                                name: 'IGNBaseOrto',
                                matrixSet: 'GoogleMapsCompatible',
                                legend: 'Topónimos',
                                isBase: false,
                                displayInLayerSwitcher: false,
                                queryable: true,
                                visible: true,
                                format: 'image/png',
                                })
                            ],
                        },
                    ]
                  });


                  mapjs.addPlugin(backImgLayer);
    
</script>

  <script type="text/javascript" src="assets/js/scripts.js"></script>

</body>
</html>
