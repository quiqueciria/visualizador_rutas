<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor de rutas GPX</title>

  <link type="text/css" rel="stylesheet" href="https://componentes-beta.idee.es/api-idee/assets/css/apiidee.ol.min.css">

  <link type="text/css" rel="stylesheet" href="assets/css/styles.css">

  <script type="text/javascript" src="https://componentes-beta.idee.es/api-idee/vendor/browser-polyfill.js"></script>
  <script type="text/javascript" src="https://componentes-beta.idee.es/api-idee/js/apiidee.ol.min.js"></script>
  <script type="text/javascript" src="https://componentes-beta.idee.es/api-idee/js/configuration.js"></script>

     <!-- backimglayer plugin -->
    <link href="https://componentes-beta.idee.es/api-idee/plugins/backimglayer/backimglayer.ol.min.css"
        rel="stylesheet" />
    <script type="text/javascript"
        src="https://componentes-beta.idee.es/api-idee/plugins/backimglayer/backimglayer.ol.min.js"></script>



</head>
<body>
  <!-- Botón para abrir/cerrar el panel en móvil -->
  <button id="sidebarToggle">☰</button>

  <!-- Aplicación principal -->
  <div id="app">
    <!-- Panel lateral izq -->
    <aside id="sidebar">
      <div class="panel-title">
        <h3>Rutas GPX</h3>
      </div>

      <!-- Botón para ajustar vista a todas las rutas -->
      <button id="fitAllBtn">Ajustar vista a todas</button>

      <label class="map-filter" for="mapFilter">
        <span>Filtro del mapa</span>
        <select id="mapFilter">
          <option value="color">Color</option>
          <option value="grayscale">Blanco y negro</option>
        </select>
      </label>

      <!-- Lista dinámica de rutas cargadas -->
      <div id="routeList"></div>
    </aside>

    <!-- Mapa de la derecha -->
    <div id="mapjs" class="m-container"></div>
  </div>

      <script type="text/javascript">
        window.mapjs = IDEE.map({
            container: 'mapjs',
            controls: [],
          center: [-412305.13, 4926696.67],
          zoom: 7,
        });

        // BackImgLayer PLUGIN (descomentar para usar)
                  const backImgLayer = new IDEE.plugin.BackImgLayer({
                  order: 0,
                    layerOpts: [
                    {
                        id: 'MapaRaster',
                        title: 'Cartografía Ráster de España del IGN',
                        preview: 'https://www.ign.es/iberpix/img/raster.png',
                        layers: [new IDEE.layer.WMTS({
                        url: 'https://www.ign.es/wmts/mapa-raster?',
                        name: 'MTN',
                        legend: 'Cartografía Ráster de España del IGN',
                                matrixSet: 'GoogleMapsCompatible',
                                isBase: true,
                                displayInLayerSwitcher: false,
                                queryable: false,
                                visible: true,
                                format: 'image/jpeg',
                            })],
                    },
                    {
                        id: 'mapa',
                        title: 'Mapa',
                        preview: 'https://www.ign.es/iberpix/img/mapa.png', // ruta relativa, edite por la deseada
                        layers: [new IDEE.layer.WMTS({
                            url: 'http://www.ign.es/wmts/ign-base?',
                            name: 'IGNBaseTodo',
                            legend: 'Callejero',
                            matrixSet: 'GoogleMapsCompatible',
                            isBase: true,
                            displayInLayerSwitcher: false,
                            queryable: false,
                            visible: true,
                            format: 'image/jpeg',
                        })],
                    },
                    {
                      id: 'openstreetmap',
                      title: 'OpenStreetMap',
                      preview: 'https://tile.openstreetmap.org/6/31/24.png',
                      layers: [new IDEE.layer.XYZ({
                        url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
                        name: 'OpenStreetMap',
                        legend: 'OpenStreetMap',
                        projection: 'EPSG:3857',
                            attributions: '© OpenStreetMap contributors',
                        isBase: true,
                        displayInLayerSwitcher: false,
                        queryable: false,
                        visible: true,
                        maxZoom: 19,
                      })],
                    },
                    {
                        id: 'Imagen',
                        title: 'Imagen',
                        preview: 'https://www.ign.es/iberpix/img/image.png', // URL de previsualización oficial [cite: 67]
                        layers: [
                            new IDEE.layer.XYZ({
                                url: 'https://tms-pnoa.idee.es/1.0.0/pnoa/{z}/{x}/{-y}.jpeg',
                                name: 'PNOA',
                                legend: 'Ortofoto',
                                projection: 'EPSG:3857',
                                isBase: true,
                                displayInLayerSwitcher: false,
                                queryable: false,
                                visible: true,
                                maxZoom: 19
                            }),
                            new IDEE.layer.WMTS({
                                url: 'https://www.ign.es/wmts/pnoa?',
                                name: 'OI.OrthoimageCoverage',
                                matrixSet: 'GoogleMapsCompatible',
                                legend: 'Ortofoto',
                                isBase: false,
                                displayInLayerSwitcher: false,
                                queryable: false,
                                visible: true,
                                format: 'image/jpeg',
                                minZoom: 19
                            })
                        ]
                    }, 
                    {
                            id: 'hibrido',
                            title: 'Híbrido',
                            preview: 'https://www.ign.es/iberpix/img/hibrido.png', // ruta relativa, edite por la deseada
                            layers: [new IDEE.layer.WMTS({
                                    url: 'http://www.ign.es/wmts/pnoa-ma?',
                                    name: 'OI.OrthoimageCoverage',
                                    legend: 'Imagen (PNOA)',
                                    matrixSet: 'GoogleMapsCompatible',
                                    isBase: false,
                                    displayInLayerSwitcher: false,
                                    queryable: false,
                                    visible: true,
                                    format: 'image/png',
                                }),
                                new IDEE.layer.WMTS({
                                    url: 'http://www.ign.es/wmts/ign-base?',
                                    name: 'IGNBaseTodo',
                                    matrixSet: 'GoogleMapsCompatible',
                                    legend: 'Mapa IGN',
                                    isBase: true,
                                    displayInLayerSwitcher: false,
                                    queryable: false,
                                    visible: true,
                                    format: 'image/png',
                                })
                            ],
                        },
                    ]
                  });


                  mapjs.addPlugin(backImgLayer);
    
</script>

  <script type="text/javascript" src="assets/js/scripts.js"></script>

</body>
</html>
