<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor de rutas GPX</title>

  <link type="text/css" rel="stylesheet" href="https://componentes.idee.es/api-idee/assets/css/apiidee.ol.min.css">
  <script type="text/javascript" src="https://componentes.idee.es/api-idee/vendor/browser-polyfill.js"></script>
  <script type="text/javascript" src="https://componentes.idee.es/api-idee/js/apiidee.ol.min.js"></script>
  <script type="text/javascript" src="https://componentes.idee.es/api-idee/js/configuration.js"></script>

  <!-- Estilos CSS del visor -->
  <style>
    /* Estilos globales de la página */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #1f2a37;
      overflow: hidden;
    }

    /* Layout principal: app + sidebar + mapa */
    #app {
      display: flex;
      height: 100vh;
      width: 100vw;
      background: #eef4f8;
    }

    /* Panel lateral izquierdo */
    #sidebar {
      width: 320px;
      min-width: 320px;
      height: 100vh;
      background: #fff;
      border-right: 1px solid #ccd6e0;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.08);
      padding: 16px 14px;
      box-sizing: border-box;
      overflow-y: auto;
    }

    #sidebar h3 {
      margin: 0 0 12px;
      font-size: 20px;
      color: #244b70;
    }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    #fitAllBtn {
      width: 100%;
      border: 0;
      background: #24597a;
      color: white;
      font-weight: bold;
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 12px;
    }

    #fitAllBtn:hover {
      background: #173f5f;
    }

    /* Lista de rutas dentro del panel */
    #routeList {
      margin-top: 12px;
    }

    /* Cada ruta mostrada en el listado */
    .route-item {
      border: 1px solid #ccd8e5;
      border-radius: 8px;
      background: #f9fbfd;
      padding: 10px;
      margin-bottom: 10px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
    }

    .route-head {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      font-size: 13px;
      color: #253b52;
      cursor: pointer;
    }

    .route-head input {
      transform: scale(1.1);
      accent-color: #24597a;
      cursor: pointer;
    }

    .route-dist {
      font-size: 11px;
      color: #5c6b79;
      margin: 8px 0 8px 23px;
    }

    .route-actions {
      display: flex;
      gap: 6px;
      margin-left: 23px;
    }

    .route-actions button {
      border: 0;
      background: #e7eef4;
      color: #244b70;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 11px;
      cursor: pointer;
    }

    .route-actions button:hover {
      background: #bfd8ea;
    }

    /* Contenedor del mapa derecho */
    #mapjs {
      flex: 1;
      height: 100vh;
      min-width: 400px;
    }

    /* Mensaje de rutas vacías */
    .empty {
      font-size: 12px;
      color: #607389;
      padding: 12px 0;
    }
  </style>
</head>
<body>
  <!-- Aplicación principal -->
  <div id="app">
    <!-- Panel lateral izq -->
    <aside id="sidebar">
      <div class="panel-title">
        <h3>Rutas GPX</h3>
      </div>

      <!-- Botón para ajustar vista a todas las rutas -->
      <button id="fitAllBtn">Ajustar vista a todas</button>

      <!-- Lista dinámica de rutas cargadas -->
      <div id="routeList"></div>
    </aside>

    <!-- Mapa de la derecha -->
    <div id="mapjs" class="m-container"></div>
  </div>

  <!-- Script principal del visor -->
  <script type="text/javascript">
    (function () {
      // Paleta de colores para cada nueva ruta
      const PALETTE = ['#e8542b', '#3b9c4b', '#3b82c4', '#c94f9e', '#e0a72b', '#4fb8a8', '#8b5fbf', '#c4443b'];
      // Colección de rutas guardadas
      const routes = new Map();
      // Contador de rutas para generar ids
      let routeCounter = 0;
      // Instancia del mapa
      let map;

      // Inicialización del mapa base
      function initMap() {
        const baseLayer = new M.layer.WMTS({
          url: 'https://www.ign.es/wmts/ign-base?',
          name: 'IGNBaseTodo',
          legend: 'Mapa IGN',
          matrixSet: 'GoogleMapsCompatible',
          transparent: false,
          displayInLayerSwitcher: false,
          queryable: false,
          visible: true,
          format: 'image/jpeg',
        });

        map = M.map({
          container: 'mapjs',
          projection: 'EPSG:4326*',
          center: [-3.7038, 40.4168],
          zoom: 6,
          layers: [baseLayer],
        });
      }

      // Parseo del archivo GPX para extraer tramos y puntos
      function parseGPX(text, fallbackName) {
        const xml = new DOMParser().parseFromString(text, 'application/xml');
        const segments = [];

        xml.querySelectorAll('trk').forEach(trk => {
          trk.querySelectorAll('trkseg').forEach(seg => {
            const pts = Array.from(seg.querySelectorAll('trkpt')).map(readPt).filter(Boolean);
            if (pts.length > 1) segments.push(pts);
          });
        });

        if (!segments.length) {
          xml.querySelectorAll('rte').forEach(rte => {
            const pts = Array.from(rte.querySelectorAll('rtept')).map(readPt).filter(Boolean);
            if (pts.length > 1) segments.push(pts);
          });
        }

        if (!segments.length) return null;

        const nameEl = xml.querySelector('trk > name') || xml.querySelector('metadata > name');
        const name = (nameEl && nameEl.textContent.trim()) || fallbackName;

        return { name, segments };
      }

      // Lectura de un punto GPX con latitud y longitud
      function readPt(pt) {
        const lat = parseFloat(pt.getAttribute('lat'));
        const lon = parseFloat(pt.getAttribute('lon'));
        if (Number.isNaN(lat) || Number.isNaN(lon)) return null;
        return { lat, lon };
      }

      // Distancia entre dos puntos para calcular kilometraje
      function haversine(a, b) {
        const R = 6371000;
        const toRad = d => d * Math.PI / 180;
        const dLat = toRad(b.lat - a.lat);
        const dLon = toRad(b.lon - a.lon);
        const s = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLon / 2) ** 2;
        return 2 * R * Math.asin(Math.sqrt(s));
      }

      // Estadísticas de cada ruta: distancia y bounding box
      function computeStats(segments) {
        let distM = 0;
        let minLon = Infinity, minLat = Infinity, maxLon = -Infinity, maxLat = -Infinity;

        segments.forEach(seg => {
          for (let i = 0; i < seg.length; i++) {
            const p = seg[i];
            minLon = Math.min(minLon, p.lon);
            maxLon = Math.max(maxLon, p.lon);
            minLat = Math.min(minLat, p.lat);
            maxLat = Math.max(maxLat, p.lat);

            if (i > 0) distM += haversine(seg[i - 1], p);
          }
        });

        return { distanceKm: distM / 1000, bbox: [minLon, minLat, maxLon, maxLat] };
      }

      // Conversión de los puntos GPX a GeoJSON para la capa de rutas
      function segmentsToGeoJSON(segments) {
        const geometry = segments.length > 1
          ? { type: 'MultiLineString', coordinates: segments.map(seg => seg.map(p => [p.lon, p.lat])) }
          : { type: 'LineString', coordinates: segments[0].map(p => [p.lon, p.lat]) };

        return {
          type: 'FeatureCollection',
          crs: { type: 'name', properties: { name: 'EPSG:4326' } },
          features: [{ type: 'Feature', properties: {}, geometry }]
        };
      }

      // Añade la capa de ruta al mapa basado en GeoJSON
      function addRouteLayer(route) {
        const geojson = segmentsToGeoJSON(route.segments);
        const style = new M.style.Line({ stroke: { color: route.color, width: 4 } });
        const layer = new M.layer.GeoJSON({ name: route.id, legend: route.name, source: geojson }, { style: style, displayInLayerSwitcher: false });
        map.addLayers(layer);
        route.layer = layer;
      }

      // Ajusta el mapa al recuadro del bbox de una ruta
      function zoomToBbox(bbox, pad) {
        let [minLon, minLat, maxLon, maxLat] = bbox;
        const w = Math.max(maxLon - minLon, 0.0008);
        const h = Math.max(maxLat - minLat, 0.0008);
        const p = pad != null ? pad : 0.15;

        minLon -= w * p;
        maxLon += w * p;
        minLat -= h * p;
        maxLat += h * p;

        map.setBbox([minLon, minLat, maxLon, maxLat]);
      }

      // Elemento DOM donde se dibuja la lista de rutas
      const routeList = document.getElementById('routeList');

      // Dibuja en el panel lateral el listado de rutas cargadas
      function renderList() {
        routeList.innerHTML = '';

        if (!routes.size) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = 'No hay rutas cargadas.';
          routeList.appendChild(empty);
          return;
        }

        routes.forEach(route => {
          const div = document.createElement('div');
          div.className = 'route-item';
          div.innerHTML = `
            <div class="route-head">
              <input type="checkbox" ${route.visible ? 'checked' : ''}>
              <span style="color:${route.color};">●</span>
              <span>${route.name}</span>
            </div>
            <div class="route-dist">${route.stats.distanceKm.toFixed(2)} km</div>
            <div class="route-actions">
              <button class="zoom-btn">Ir a</button>
              <button class="del-btn">Eliminar</button>
            </div>
          `;

          div.querySelector('input').addEventListener('change', e => {
            route.visible = e.target.checked;
            route.layer.setVisible(route.visible);
          });

          div.querySelector('.zoom-btn').addEventListener('click', () => zoomToBbox(route.stats.bbox, 0.25));
          div.querySelector('.del-btn').addEventListener('click', () => {
            map.removeLayers(route.layer);
            routes.delete(route.id);
            renderList();
          });

          routeList.appendChild(div);
        });
      }

      // Botón para ajustar mapa a todas las rutas visibles
      document.getElementById('fitAllBtn').addEventListener('click', () => {
        if (!routes.size) return;

        let minLon = Infinity, minLat = Infinity, maxLon = -Infinity, maxLat = -Infinity;
        routes.forEach(r => {
          const [a, b, c, d] = r.stats.bbox;
          minLon = Math.min(minLon, a);
          minLat = Math.min(minLat, b);
          maxLon = Math.max(maxLon, c);
          maxLat = Math.max(maxLat, d);
        });

        zoomToBbox([minLon, minLat, maxLon, maxLat], 0.12);
      });

      // Carga automática de archivos GPX desde la carpeta gpx/ del proyecto
      function loadRoutesFromFolder(folderUrl) {
        fetch(folderUrl)
          .then(response => {
            if (!response.ok) {
              throw new Error('No se puede acceder a la carpeta de rutas GPX.');
            }
            return response.text();
          })
          .then(html => {
            const doc = new DOMParser().parseFromString(html, 'text/html');
            const links = Array.from(doc.querySelectorAll('a.file.gpx'));
            const gpxFiles = links
              .map(link => link.getAttribute('href'))
              .filter(Boolean)
              .map(href => href.replace(/\\/g, '/'))
              .map(href => href.startsWith('http') ? href : new URL(href, window.location.origin + '/' + folderUrl).toString());

            if (!gpxFiles.length) {
              routeList.innerHTML = '<div class="empty">No hay rutas GPX en la carpeta gpx/.</div>';
              return;
            }

            const requests = gpxFiles.map(gpxFile => fetch(gpxFile).then(res => res.text()));
            Promise.all(requests)
              .then(texts => {
                texts.forEach((text, index) => {
                  const filename = gpxFiles[index].split('/').pop() || 'ruta.gpx';
                  const parsed = parseGPX(text, filename.replace(/\.gpx$/i, ''));
                  if (!parsed) return;

                  const id = 'route-' + (++routeCounter);
                  const route = {
                    id,
                    name: parsed.name,
                    color: PALETTE[(routeCounter - 1) % PALETTE.length],
                    segments: parsed.segments,
                    stats: computeStats(parsed.segments),
                    visible: true,
                    layer: null,
                  };

                  routes.set(id, route);
                  addRouteLayer(route);
                });

                renderList();

                if (routes.size === 1) {
                  const firstRoute = Array.from(routes.values())[0];
                  zoomToBbox(firstRoute.stats.bbox, 0.25);
                }
              })
              .catch(error => {
                console.error(error);
                routeList.innerHTML = '<div class="empty">No se pudieron cargar las rutas GPX.</div>';
              });
          })
          .catch(error => {
            console.error(error);
            routeList.innerHTML = '<div class="empty">No se encontró la carpeta gpx/.</div>';
          });
      }

      // Inicio de la aplicación: mapa + carga de rutas desde gpx/
      window.addEventListener('load', function () {
        initMap();
        loadRoutesFromFolder('gpx/');
      });
    })();
  </script>
</body>
</html>
